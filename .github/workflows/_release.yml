name: Release (reusable)

# Shared release steps, called by release-<package>.yml. Do not run it directly.
# One package per call: bump its version, publish it to npm with Trusted Publishing
# (OIDC, no NPM_TOKEN), then commit, tag and create a GitHub Release.
# Every package has its own version and tag prefix (docs/adr/0001-monorepo.md):
#   purus -> v1.2.0     linter -> linter-v1.2.0   (and so on)
#
# Requirements (see #13, #14, docs/release.md): npm Trusted Publisher per package pointing at
# its release-<package>.yml, the release environment with RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY,
# and the purus-release app as bypass actor of the rulesets.
on:
  workflow_call:
    inputs:
      package:
        description: "Package to release: purus, linter, prettier-plugin, language-server or mcp"
        type: string
        required: true
      version:
        description: "Version to release: a semver bump (patch/minor/major/prerelease) or an explicit version (e.g. 1.2.0 or 1.2.0-beta.0)"
        type: string
        required: true
      dist_tag:
        description: 'npm dist-tag. Empty = auto-detect: the prerelease identifier (e.g. beta from 1.2.0-beta.0), or latest.'
        type: string
        required: false
        default: ""
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      # Short-lived token of the release bot. It is the only identity allowed to
      # push to the protected main branch and to create release tags.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted Publishing needs npm >= 11 (also fixes workspace resolution).
      - run: npm install -g npm@11

      - name: Resolve package
        id: pkg
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            purus)
              DIR="."; TAG_PREFIX="v" ;;
            linter | prettier-plugin | language-server | mcp)
              DIR="packages/$PACKAGE"; TAG_PREFIX="$PACKAGE-v" ;;
            *)
              echo "::error::Unknown package: $PACKAGE"; exit 1 ;;
          esac
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::$DIR/package.json does not exist on this branch (package not migrated yet?)"
            exit 1
          fi
          NAME="$(node -p "require('./$DIR/package.json').name")"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Install MoonBit (compiler only)
        if: inputs.package == 'purus'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check and test (compiler)
        if: inputs.package == 'purus'
        run: |
          moon update
          moon check
          moon test

      - name: Test and build (workspace package)
        if: inputs.package != 'purus'
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          npm test -w "$NAME" --if-present
          npm run build -w "$NAME" --if-present

      - name: Bump version
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          DIST_TAG_INPUT: ${{ inputs.dist_tag }}
          DIR: ${{ steps.pkg.outputs.dir }}
          NAME: ${{ steps.pkg.outputs.name }}
          TAG_PREFIX: ${{ steps.pkg.outputs.tag_prefix }}
        run: |
          OLD="$(node -p "require('./$DIR/package.json').version")"
          if [ "$DIR" = "." ]; then
            npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version >/dev/null
            node scripts/sync-version.js
          else
            npm version "$VERSION_INPUT" -w "$NAME" --no-git-tag-version --allow-same-version >/dev/null
          fi
          NEW="$(node -p "require('./$DIR/package.json').version")"
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_PREFIX}${NEW}" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version is already ${NEW}; skipping the bump commit but still releasing."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$NEW" == *-* ]]; then
            REST="${NEW#*-}"
            PRERELEASE_ID="${REST%%.*}"
          else
            PRERELEASE_ID=""
          fi
          TAG="$DIST_TAG_INPUT"
          if [ -z "$TAG" ]; then
            if [ -n "$PRERELEASE_ID" ]; then TAG="$PRERELEASE_ID"; else TAG="latest"; fi
          fi
          echo "npm_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([ "$TAG" = "latest" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          PREV="$(git tag --list "${TAG_PREFIX}[0-9]*" --sort=-v:refname | head -n 1)"
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build (compiler)
        if: inputs.package == 'purus'
        run: npm run build

      - name: Verify package (compiler)
        if: inputs.package == 'purus'
        run: node -e "const p = require('.'); console.log('version:', p.version); console.log(p.compile('const x be 42'))"

      - name: Commit and tag (local)
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIR: ${{ steps.pkg.outputs.dir }}
          TAG: ${{ steps.bump.outputs.tag }}
          CHANGED: ${{ steps.bump.outputs.changed }}
          VERSION: ${{ steps.bump.outputs.version }}
          PACKAGE: ${{ inputs.package }}
        run: |
          BOT_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          if [ "$CHANGED" = "true" ]; then
            git add "$DIR/package.json" package-lock.json
            if [ "$PACKAGE" = "purus" ]; then git add moon.mod; fi
            git commit -m "release($PACKAGE): v${VERSION}"
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag "${TAG}"
          fi
          # Fail before publishing if the bot cannot push (ruleset misconfigured).
          git push --dry-run origin HEAD "${TAG}"

      # Trusted Publishing: no NODE_AUTH_TOKEN. npm exchanges the OIDC token for a
      # short-lived publish credential.
      - name: Publish to npm
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
          NAME: ${{ steps.pkg.outputs.name }}
          NPM_TAG: ${{ steps.bump.outputs.npm_tag }}
        run: |
          if [ "$DIR" = "." ]; then
            npm publish --access public --provenance --tag "$NPM_TAG"
          else
            npm publish -w "$NAME" --access public --provenance --tag "$NPM_TAG"
          fi

      - name: Push commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: git push origin HEAD "${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          PREV: ${{ steps.bump.outputs.previous_tag }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        run: |
          ARGS=(--title "$TAG" --generate-notes)
          if [ -n "$PREV" ]; then ARGS+=(--notes-start-tag "$PREV"); fi
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "$TAG" "${ARGS[@]}"
