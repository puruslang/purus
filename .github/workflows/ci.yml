name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: moon update
      - run: moon check
      - run: moon fmt --check
      - run: moon test
      - name: Generated interfaces are up to date
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
      - run: pnpm run build
      - run: pnpm run test:packages
      - name: TypeScript checks (typecheck, ESLint, Prettier)
        run: |
          pnpm run typecheck:ts
          pnpm run lint:ts
          pnpm run format:check:ts
      - name: Verify API
        run: node -e "const p = require('./packages/purus'); console.log('version:', p.version); console.log(p.compile('const x be 42'))"
      - name: Compile examples
        run: |
          for f in examples/*.purus; do
            echo "compile $f"
            node packages/purus/dist/cli.cjs build --stdout "$f" > /dev/null
          done
